<!DOCTYPE html>
<html lang="es">
  <head>
    <title>{% block title %}layout{% endblock %}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    {% block head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
    <link href="https://fonts.googleapis.com/css?family=Rock+Salt" rel="stylesheet" type="text/css"/>
        {% endblock %}
  </head>
  <body>
    <main>
      <img src="{{ url_for('static', filename='logo-app.png') }}" alt="Logo de la aplicación">
      {% block content %} {% with messages = get_flashed_messages(with_categories=true) %} 
      {% if messages %} {% for category, message in messages %}
        <div class="alert{{category}} show{{category}}">
          <span class="material-symbols-outlined{{category}}"></span>
          <span class="msg{{category}}">{{message}}</span>
          <span class="close-btn{{category}}">
            <span class="material-symbols-outlined{{category}}"></span>
          </span>
      </div>
      {% endfor %} {% endif %} {% endwith %} {% endblock %}
    </main>
    <footer>{% block footer %} {% endblock %}</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
